[package]
name = "dfmv"
version = "1.0.0"
description = "Damn Fast Media Viewer"
authors = ["c4lyp5o"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.12.5", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-libmpv = "0.3.2"
walkdir = "2.5.0"

