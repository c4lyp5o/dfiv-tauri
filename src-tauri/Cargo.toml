[package]
name = "dfmv"
version = "1.0.0"
description = "Damn Fast Media Viewer"
authors = ["c4lyp5o"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
tauri = { version = "2.10.3", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-libmpv = "0.3.2"
walkdir = "2.4.0"

