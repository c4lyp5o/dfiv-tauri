[package]
name = "dfmv"
version = "1.0.0"
description = "Damn Fast Media Viewer
authors = ["c4lyp5o"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dfiv_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
walkdir = "2.4.0"

