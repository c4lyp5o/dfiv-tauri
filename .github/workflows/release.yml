name: Release

# Push a tag like v1.2.0 to build installers for every platform into a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            args: ""
          - name: linux-x86_64
            os: ubuntu-22.04
            wrapper: linux-x86_64
            args: ""
          - name: macos-aarch64
            os: macos-latest
            wrapper: macos-aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            wrapper: macos-x86_64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Fetch libmpv-wrapper
        if: matrix.wrapper
        run: bash scripts/fetch-libmpv-wrapper.sh ${{ matrix.wrapper }}

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Damn Fast Media Viewer ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new
            and the [README](https://github.com/${{ github.repository }}#install) for platform requirements.
            macOS and Linux need libmpv installed (`brew install mpv` / `sudo apt install libmpv2`). Builds are unsigned.
          releaseDraft: true
          prerelease: false
